<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>مدرستي - تطبيق المعلمين</title>
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1e3a5f;
  --primary-light:#2563eb;
  --accent:#10b981;
  --accent-dark:#059669;
  --bg:#e0f2fe;
  --card:#ffffff;
  --text:#1e293b;
  --muted:#64748b;
  --danger:#ef4444;
  --warning:#f59e0b;
  --shadow:0 4px 20px rgba(30,58,95,.12);
  --shadow-lg:0 10px 40px rgba(30,58,95,.2);
  --radius:16px;
  --radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden}

/* ═══ شاشة تسجيل الدخول ═══ */
.login-screen{
  min-height:100vh;
  background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 50%,#10b981 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  position:relative;
  overflow:hidden;
}
.login-screen::before{
  content:'';position:absolute;top:-100px;right:-100px;
  width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.1);filter:blur(60px);
}
.login-card{
  background:#fff;border-radius:24px;padding:30px;
  width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  position:relative;z-index:2;
}
.login-logo{
  width:80px;height:80px;margin:0 auto 15px;
  background:linear-gradient(135deg,#1e3a5f,#2563eb);
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:40px;box-shadow:0 10px 30px rgba(37,99,235,.3);
}
.login-card h1{
  text-align:center;color:var(--primary);
  font-size:28px;font-weight:900;margin-bottom:5px;
}
.login-card p{
  text-align:center;color:var(--muted);
  font-size:13px;margin-bottom:20px;
}
.login-card label{
  display:block;font-size:13px;font-weight:800;
  color:var(--muted);margin-bottom:6px;
}
.login-card input{
  width:100%;border:2px solid #e2e8f0;border-radius:12px;
  padding:12px;font-size:16px;font-family:inherit;
  margin-bottom:12px;transition:.2s;
}
.login-card input:focus{outline:none;border-color:var(--primary-light)}
.login-btn{
  width:100%;border:none;border-radius:12px;
  padding:14px;font-size:16px;font-weight:800;
  font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;box-shadow:0 6px 20px rgba(30,58,95,.3);
  transition:.2s;
}
.login-btn:active{transform:scale(.97)}

/* ══ التطبيق الرئيسي ═══ */
.app{display:none;min-height:100vh;flex-direction:column}
.app.active{display:flex}

/* ═══ الشريط العلوي ═══ */
.topbar{
  background:linear-gradient(135deg,#1e3a5f,#2563eb);
  color:#fff;padding:15px 20px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 4px 20px rgba(30,58,95,.3);
  position:relative;overflow:hidden;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:3px;background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444);
}
.topbar-avatar{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  border:2px solid rgba(255,255,255,.3);
}
.topbar-info{flex:1;min-width:0}
.topbar-info h2{font-size:16px;font-weight:900;margin-bottom:2px}
.topbar-info .subjects{font-size:11px;opacity:.9;margin-bottom:3px}
.topbar-info .code{
  display:inline-block;background:rgba(255,255,255,.2);
  padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;
}
.topbar-school{
  font-size:30px;flex-shrink:0;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
}

/* ═══ المحتوى ═══ */
.main-content{
  flex:1;padding:15px;
  padding-bottom:100px;
  max-width:900px;margin:0 auto;width:100%;
}

/* ═══ بطاقة الشهر ═══ */
.month-card{
  background:#fff;border-radius:20px;
  padding:18px;margin-bottom:15px;
  box-shadow:var(--shadow);
  display:flex;align-items:center;gap:15px;
  position:relative;overflow:hidden;
}
.month-card::before{
  content:'';position:absolute;top:0;right:0;
  width:120px;height:120px;
  background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(37,99,235,.1));
  border-radius:50%;transform:translate(30%,-30%);
}
.month-icon{
  width:55px;height:55px;border-radius:14px;
  background:linear-gradient(135deg,#e0f2fe,#bae6fd);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(37,99,235,.15);
}
.month-info{flex:1;position:relative;z-index:1}
.month-info h3{font-size:22px;font-weight:900;color:var(--primary);margin-bottom:3px}
.month-info small{font-size:12px;color:var(--muted);font-weight:700}
.month-deco{font-size:50px;opacity:.8;position:relative;z-index:1}

/* ═══ أزرار الشعب ═══ */
.classes-row{
  display:flex;gap:8px;margin-bottom:15px;
  overflow-x:auto;padding-bottom:5px;
  scrollbar-width:none;
}
.classes-row::-webkit-scrollbar{display:none}
.class-btn{
  flex:0 0 auto;
  padding:12px 18px;border:2px solid #e2e8f0;
  background:#fff;border-radius:14px;
  font-size:13px;font-weight:800;color:var(--primary);
  font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:.2s;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.class-btn:active{transform:scale(.95)}
.class-btn.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 20px rgba(37,99,235,.3);
}
.class-btn .icon{font-size:16px}

/* ═══ شريط الأدوات ═══ */
.tools-bar{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  border-radius:16px;padding:12px;
  display:flex;gap:8px;align-items:center;
  margin-bottom:15px;flex-wrap:wrap;
  box-shadow:0 6px 20px rgba(16,185,129,.3);
}
.tool-btn{
  background:#fff;border:none;border-radius:12px;
  padding:10px 14px;font-size:13px;font-weight:800;
  font-family:inherit;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  color:var(--accent-dark);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:.2s;
}
.tool-btn:active{transform:scale(.95)}
.tool-btn.danger{color:var(--danger)}
.tool-btn .icon{font-size:16px}
.max-input{
  display:flex;align-items:center;gap:6px;
  color:#fff;font-size:13px;font-weight:700;
  margin-right:auto;
}
.max-input input{
  width:55px;padding:8px;border:none;
  border-radius:10px;text-align:center;
  font-size:14px;font-weight:800;font-family:inherit;
}

/* ═══ الإحصائيات ═══ */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;margin-bottom:15px;
}
.stat-card{
  background:#fff;border-radius:14px;
  padding:12px 8px;text-align:center;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  transition:.2s;
}
.stat-card:hover{transform:translateY(-2px)}
.stat-card .stat-icon{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 6px;font-size:18px;font-weight:900;
}
.stat-card .stat-label{
  font-size:11px;color:var(--muted);
  font-weight:700;margin-bottom:3px;
}
.stat-card .stat-value{
  font-size:20px;font-weight:900;
}
.stat-card.students{border-color:#dbeafe}
.stat-card.students .stat-icon{background:#dbeafe;color:#2563eb}
.stat-card.students .stat-value{color:#2563eb}
.stat-card.sum{border-color:#d1fae5}
.stat-card.sum .stat-icon{background:#d1fae5;color:#059669}
.stat-card.sum .stat-value{color:#059669}
.stat-card.avg{border-color:#ede9fe}
.stat-card.avg .stat-icon{background:#ede9fe;color:#7c3aed}
.stat-card.avg .stat-value{color:#7c3aed}
.stat-card.pass{border-color:#fed7aa}
.stat-card.pass .stat-icon{background:#fed7aa;color:#ea580c}
.stat-card.pass .stat-value{color:#ea580c}

/* ═══ البحث ═══ */
.search-box{
  background:#fff;border-radius:14px;
  padding:12px 15px;margin-bottom:15px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);
  border:2px solid #e2e8f0;
}
.search-box input{
  flex:1;border:none;outline:none;
  font-size:14px;font-family:inherit;
  background:transparent;
}
.search-box .icon{font-size:20px;color:var(--muted)}

/* ═══ جدول التلاميذ ═══ */
.students-table{
  background:#fff;border-radius:16px;
  overflow:hidden;box-shadow:var(--shadow);
  margin-bottom:15px;
}
.table-header{
  background:linear-gradient(135deg,#e0f2fe,#bae6fd);
  padding:12px 15px;
  display:grid;grid-template-columns:40px 1fr 80px 40px;
  gap:8px;align-items:center;
  font-size:13px;font-weight:800;color:var(--primary);
}
.student-row{
  display:grid;grid-template-columns:40px 1fr 80px 40px;
  gap:8px;align-items:center;
  padding:10px 15px;
  border-bottom:1px solid #f1f5f9;
  transition:.2s;
}
.student-row:hover{background:#f8fafc}
.student-row:last-child{border-bottom:none}
.student-num{
  width:32px;height:32px;border-radius:10px;
  background:#e0f2fe;color:var(--primary-light);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;
}
.student-name{
  font-size:14px;font-weight:700;color:var(--text);
  background:#f8fafc;border:2px solid #e2e8f0;
  border-radius:10px;padding:8px 10px;
  font-family:inherit;
}
.student-name:focus{outline:none;border-color:var(--primary-light)}
.student-grade{
  width:100%;padding:8px;border:2px solid #fecaca;
  border-radius:10px;text-align:center;
  font-size:14px;font-weight:900;font-family:inherit;
  background:#fef2f2;color:var(--danger);
}
.student-grade.pass{background:#d1fae5;border-color:#86efac;color:#059669}
.student-grade.fail{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.student-grade:focus{outline:none}
.student-delete{
  background:none;border:none;color:#cbd5e1;
  font-size:18px;cursor:pointer;
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.student-delete:hover{background:#fee2e2;color:var(--danger)}

/* ═══ شريط الإرسال ═══ */
.send-bar{
  padding:12px;border-radius:14px;
  text-align:center;font-size:13px;font-weight:800;
  margin-bottom:15px;
}
.send-bar.ok{background:#d1fae5;color:#059669}
.send-bar.pending{background:#fef3c7;color:#92400e}
.send-bar.no{background:#fff;color:var(--muted);border:2px dashed #e2e8f0}

/* ═══ زر الإرسال العائم ═══ */
.fab{
  position:fixed;bottom:90px;left:20px;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;
  box-shadow:0 8px 25px rgba(16,185,129,.4);
  z-index:100;transition:.2s;
}
.fab:active{transform:scale(.9)}
.fab.busy{background:#94a3b8}
.fab.busy::after{
  content:'';width:24px;height:24px;
  border:3px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ شريط التنقل السفلي ═══ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#fff;
  display:flex;justify-content:space-around;
  padding:8px 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.08);
  z-index:99;
  border-top:1px solid #e2e8f0;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;
  padding:6px;background:none;border:none;
  font-family:inherit;cursor:pointer;
  color:var(--muted);transition:.2s;
}
.nav-item .nav-icon{font-size:22px}
.nav-item .nav-label{font-size:10px;font-weight:700}
.nav-item.active{color:var(--primary-light)}
.nav-item.active .nav-icon-wrap{
  background:var(--primary-light);color:#fff;
  border-radius:12px;padding:6px 12px;
  margin-bottom:-8px;
}

/* ═══ التوست ═══ */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--primary);color:#fff;
  padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:700;
  z-index:200;opacity:0;transition:.3s;
  max-width:90%;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--accent)}

/* ═══ النوافذ المنبثقة ═══ */
.overlay{
  position:fixed;inset:0;
  background:rgba(30,58,95,.6);
  backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;
  z-index:150;padding:20px;
}
.overlay.show{display:flex}
.modal{
  background:#fff;border-radius:20px;
  padding:20px;width:100%;max-width:400px;
  max-height:80vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal h3{color:var(--primary);margin-bottom:12px;font-size:18px}
.modal textarea{
  width:100%;border:2px solid #e2e8f0;
  border-radius:12px;padding:10px;
  font-family:inherit;font-size:14px;
  resize:vertical;min-height:100px;
}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1}

/* ═══ التجاوب ═══ */
@media(min-width:768px){
  .main-content{padding:20px}
  .stats-grid{grid-template-columns:repeat(4,1fr);gap:12px}
  .stat-card .stat-value{font-size:24px}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tools-bar{flex-direction:column;align-items:stretch}
  .max-input{margin-right:0;justify-content:center}
}

/* ═══ مؤشر الحفظ ═══ */
.save-indicator{
  text-align:center;font-size:11px;
  color:var(--accent);font-weight:700;
  opacity:0;transition:.3s;
  margin-bottom:10px;
}
.save-indicator.show{opacity:1}

/* ═══ حالة فارغة ═══ */
.empty-state{
  text-align:center;padding:30px;
  color:var(--muted);
}
.empty-state .icon{font-size:50px;margin-bottom:10px;opacity:.5}
.empty-state p{font-size:14px;font-weight:700}
.empty-state small{font-size:12px}
</style>
</head>
<body>

<!-- ═══ شاشة تسجيل الدخول ═══ -->
<section class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🏫</div>
    <h1>مدرستي</h1>
    <p>تطبيق المعلمين لإدخال الدرجات</p>
    <label>الكود الخاص بك</label>
    <input id="codeInput" dir="ltr" placeholder="T-XXXX" style="text-align:center;font-weight:800">
    <button class="login-btn" onclick="doLogin()">تسجيل الدخول</button>
  </div>
</section>

<!-- ══ التطبيق الرئيسي ═══ -->
<div class="app" id="mainApp">
  <!-- الشريط العلوي -->
  <header class="topbar">
    <div class="topbar-avatar">👤</div>
    <div class="topbar-info">
      <h2 id="teacherName">مرحباً بك</h2>
      <div class="subjects" id="teacherSubjects">—</div>
      <span class="code" id="teacherCode">—</span>
    </div>
    <div class="topbar-school">🏫</div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="main-content">
    <!-- بطاقة الشهر -->
    <div class="month-card">
      <div class="month-icon">📅</div>
      <div class="month-info">
        <h3 id="currentMonth">تشرين الأول</h3>
        <small>العام الدراسي 2026 - 2027</small>
      </div>
      <div class="month-deco">📚</div>
    </div>

    <!-- أزرار الشعب -->
    <div class="classes-row" id="classesRow"></div>

    <!-- شريط الأدوات -->
    <div class="tools-bar">
      <button class="tool-btn" onclick="openPaste()"><span class="icon"></span> نسخ</button>
      <button class="tool-btn" onclick="addRow()"><span class="icon">👤</span> + تلميذ</button>
      <button class="tool-btn danger" onclick="clearAll()"><span class="icon">🗑️</span> مسح</button>
      <div class="max-input">
        <span class="icon"></span>
        <span>العظمى</span>
        <input id="maxInput" type="number" value="100" min="1" onchange="onCtx()">
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="stats-grid">
      <div class="stat-card students">
        <div class="stat-icon">👥</div>
        <div class="stat-label">التلاميذ</div>
        <div class="stat-value" id="statStudents">0</div>
      </div>
      <div class="stat-card sum">
        <div class="stat-icon">Σ</div>
        <div class="stat-label">المجموع</div>
        <div class="stat-value" id="statSum">0</div>
      </div>
      <div class="stat-card avg">
        <div class="stat-icon">−</div>
        <div class="stat-label">المتوسط</div>
        <div class="stat-value" id="statAvg">-</div>
      </div>
      <div class="stat-card pass">
        <div class="stat-icon">✓</div>
        <div class="stat-label">ناجح</div>
        <div class="stat-value" id="statPass">0</div>
      </div>
    </div>

    <!-- البحث -->
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="searchInput" type="text" placeholder="ابحث عن تلميذ..." oninput="renderRows()">
    </div>

    <!-- جدول التلاميذ -->
    <div class="students-table">
      <div class="table-header">
        <span>#</span>
        <span>اسم التلميذ</span>
        <span style="text-align:center">الدرجة</span>
        <span></span>
      </div>
      <div id="studentsList"></div>
    </div>

    <!-- شريط الإرسال -->
    <div class="send-bar no" id="sendBar">لم يتم الإرسال بعد</div>
    <div class="save-indicator" id="saveInd">تم الحفظ التلقائي ✓</div>
  </main>

  <!-- زر الإرسال العائم -->
  <button class="fab" id="sendBtn" onclick="sendGrades()" title="إرسال">▶</button>

  <!-- شريط التنقل السفلي -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <div class="nav-icon-wrap"><span class="nav-icon"></span></div>
      <span class="nav-label">الرئيسية</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">👥</span>
      <span class="nav-label">التلاميذ</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label">التقارير</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">الإعدادات</span>
    </button>
  </nav>
</div>

<!-- نافذة اللصق -->
<div class="overlay" id="pasteModal">
  <div class="modal">
    <h3>📋 لصق قائمة من Excel</h3>
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">انسخ عمودي (الاسم ثم الدرجة) والصقهما هنا</p>
    <textarea id="pasteBox" placeholder="أحمد محمد&#9;95&#10;سارة علي&#9;88"></textarea>
    <div class="modal-actions">
      <button class="login-btn" style="background:#e2e8f0;color:var(--text)" onclick="hideModal('pasteModal')">إلغاء</button>
      <button class="login-btn" onclick="doPaste()">إضافة</button>
    </div>
  </div>
</div>

<!-- نافذة التأكيد -->
<div class="overlay" id="confirmModal">
  <div class="modal">
    <h3>تأكيد</h3>
    <p id="confirmMsg" style="margin-bottom:15px;line-height:1.6"></p>
    <div class="modal-actions">
      <button class="login-btn" style="background:#e2e8f0;color:var(--text)" onclick="hideModal('confirmModal')">إلغاء</button>
      <button class="login-btn" onclick="confirmAction()">نعم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SERVER_URL = "https://script.google.com/macros/s/AKfycbyZVQkKBJPvx3ewVm77eGUTr_LIsOTZvgVazwXuq5aQiQ4mprAWK_c97ZXrYA9MAc15tA/exec";
const MONTHS = ['تشرين الأول','تشرين الثاني','كانون الأول','آذار','نيسان'];
const AR = '٠٢٣٤٥٦٧٨٩';
const arNum = x => String(x).replace(/\d/g, d => AR[d]);
const $ = s => document.querySelector(s);

let T = { code:'', name:'', subject:'', classes:[], cls:'', month:MONTHS[0], drafts:{}, subjects:[] };
let toastT, confirmFn = null;
const draftKey = () => T.cls + '¦' + T.month;

function toast(m, e) {
  const t = $('#toast');
  t.textContent = m;
  t.className = 'toast show' + (e ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.className = 'toast', 3000);
}

function hideModal(id) { $('#' + id).classList.remove('show'); }

function confirmDlg(msg, fn) {
  $('#confirmMsg').textContent = msg;
  confirmFn = fn;
  $('#confirmModal').classList.add('show');
}

function confirmAction() {
  hideModal('confirmModal');
  if (confirmFn) confirmFn();
  confirmFn = null;
}

function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escA(s) { return esc(s).replace(/"/g, '&quot;'); }

async function api(p, ms) {
  const url = localStorage.getItem('d_url') || SERVER_URL;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 25000);
  try {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p), signal:ctl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

async function doLogin() {
  const code = $('#codeInput').value.trim().toUpperCase();
  if (!code) { toast('أدخل الكود', true); return; }
  toast('جاري الاتصال...');
  try {
    const r = await api({ action:'teacherLogin', code });
    if (!r.ok) { toast(r.error, true); return; }
    localStorage.setItem('d_session', JSON.stringify(r.teacher));
    enterHome();
  } catch (e) { toast('تعذر الاتصال', true); }
}

function enterHome() {
  const s = JSON.parse(localStorage.getItem('d_session') || 'null');
  if (!s) { $('#loginScreen').style.display = 'flex'; $('#mainApp').classList.remove('active'); return; }
  Object.assign(T, s);
  T.drafts = {};
  if (!T.subjects || T.subjects.length === 0) {
    if (T.subject && T.classes && T.classes.length > 0) {
      T.subjects = [{ name: T.subject, classes: T.classes }];
    }
  }
  T.month = MONTHS[0];
  T.cls = (T.classes && T.classes[0]) || '';

  $('#teacherName').textContent = T.name || 'مرحباً بك';
  $('#teacherSubjects').textContent = T.subject || '—';
  $('#teacherCode').textContent = '🔑 ' + T.code;

  $('#loginScreen').style.display = 'none';
  $('#mainApp').classList.add('active');

  buildClasses();
  loadCurrent();
}

function buildClasses() {
  const row = $('#classesRow');
  row.innerHTML = '';
  if (T.classes && T.classes.length > 0) {
    T.classes.forEach(cl => {
      const b = document.createElement('button');
      b.className = 'class-btn' + (cl === T.cls ? ' active' : '');
      b.innerHTML = '<span class="icon">👥</span> ' + cl;
      b.onclick = () => { T.cls = cl; buildClasses(); loadCurrent(); };
      row.appendChild(b);
    });
  }
}

function loadCurrent() {
  const k = draftKey();
  if (!T.drafts[k]) {
    const sv = localStorage.getItem('d_draft_' + T.code + '_' + k);
    T.drafts[k] = sv ? JSON.parse(sv) : { rows: [], sentHash: '', sentAt: 0, max: 100 };
  }
  $('#maxInput').value = T.drafts[k].max || 100;
  
  // جلب التلاميذ إذا كانت القائمة فارغة
  if (T.drafts[k].rows.length === 0 && T.cls) {
    fetchStudents();
  } else {
    renderRows();
    updStats();
    updSendBar();
  }
}

async function fetchStudents() {
  $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon"></div><p>جاري التحميل...</p></div>';
  try {
    const r = await api({ action: 'getStudents', code: T.code, cls: T.cls });
    if (r.ok && r.names && r.names.length > 0) {
      const k = draftKey();
      T.drafts[k].rows = r.names.map(n => ({ name: n, degree: '' }));
      saveDraft();
      renderRows();
      updStats();
      updSendBar();
      toast('✓ تم تحميل ' + arNum(r.names.length) + ' تلميذ');
    } else {
      $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد أسماء</p><small>تواصل مع الإدارة</small></div>';
    }
  } catch (e) {
    $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">️</div><p>تعذر التحميل</p></div>';
  }
}

function onCtx() { saveDraft(); updStats(); updSendBar(); }

function saveDraft() {
  const k = draftKey();
  if (!T.drafts[k]) return;
  T.drafts[k].max = Number($('#maxInput').value) || 100;
  localStorage.setItem('d_draft_' + T.code + '_' + k, JSON.stringify(T.drafts[k]));
  const ind = $('#saveInd');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 2000);
}

function renderRows() {
  const dr = T.drafts[draftKey()];
  const box = $('#studentsList');
  if (!dr) { box.innerHTML = ''; return; }
  const search = ($('#searchInput').value || '').trim().toLowerCase();
  const max = Number($('#maxInput').value) || 100;
  box.innerHTML = '';
  let idx = 1;
  dr.rows.forEach((r, i) => {
    if (search && !(r.name || '').toLowerCase().includes(search)) return;
    const deg = Number(r.degree);
    const isPass = !isNaN(deg) && deg >= max / 2;
    const isFail = !isNaN(deg) && deg < max / 2 && deg >= 0;
    const cls = isPass ? 'pass' : (isFail ? 'fail' : '');
    const row = document.createElement('div');
    row.className = 'student-row';
    row.innerHTML = `
      <div class="student-num">${arNum(idx)}</div>
      <input class="student-name" placeholder="اسم التلميذ" value="${escA(r.name)}">
      <input class="student-grade ${cls}" type="number" inputmode="decimal" placeholder="—" value="${r.degree === '' ? '' : escA(r.degree)}">
      <button class="student-delete">✕</button>
    `;
    const inputs = row.querySelectorAll('input');
    inputs[0].oninput = () => { dr.rows[i].name = inputs[0].value; saveDraft(); updStats(); updSendBar(); };
    inputs[1].oninput = () => {
      dr.rows[i].degree = inputs[1].value;
      const v = Number(inputs[1].value);
      inputs[1].classList.remove('pass', 'fail');
      if (!isNaN(v) && v >= max / 2) inputs[1].classList.add('pass');
      else if (!isNaN(v) && v < max / 2 && v >= 0) inputs[1].classList.add('fail');
      saveDraft(); updStats(); updSendBar();
    };
    row.querySelector('.student-delete').onclick = () => {
      if (dr.rows.length <= 1) { toast('يجب بقاء صف واحد', true); return; }
      dr.rows.splice(i, 1); saveDraft(); renderRows(); updStats(); updSendBar();
    };
    box.appendChild(row);
    idx++;
  });
  if (idx === 1 && !search) {
    box.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>لا توجد أسماء</p><small>استخدم زر "نسخ" أو "+ تلميذ"</small></div>';
  }
}

function addRow() {
  if (!T.cls) { toast('اختر الشعبة أولاً', true); return; }
  T.drafts[draftKey()].rows.push({ name: '', degree: '' });
  saveDraft(); renderRows();
  const last = $('#studentsList').lastElementChild;
  if (last) last.querySelector('input').focus();
}

function clearAll() {
  confirmDlg('مسح جميع التلاميذ والدرجات؟', () => {
    T.drafts[draftKey()].rows = [];
    saveDraft(); renderRows(); updStats(); updSendBar();
    toast('تم المسح ✓');
  });
}

function updStats() {
  const dr = T.drafts[draftKey()];
  if (!dr) return;
  const max = Number($('#maxInput').value) || 100;
  const rows = dr.rows.filter(r => (r.name || '').trim() || String(r.degree ?? '') !== '');
  const dg = rows.map(r => Number(r.degree)).filter(v => !isNaN(v));
  const sum = dg.reduce((a, b) => a + b, 0);
  const avg = dg.length ? (sum / dg.length).toFixed(1) : '-';
  const pass = dg.filter(v => v >= max / 2).length;
  $('#statStudents').textContent = arNum(rows.length);
  $('#statSum').textContent = arNum(sum);
  $('#statAvg').textContent = avg === '-' ? '-' : arNum(avg.replace('.', '٫'));
  $('#statPass').textContent = arNum(pass);
}

function updSendBar() {
  const dr = T.drafts[draftKey()];
  const el = $('#sendBar');
  if (!dr) return;
  const clean = dr.rows.filter(r => (r.name || '').trim() && String(r.degree ?? '') !== '').map(r => ({ name: r.name, degree: Number(r.degree) }));
  const max = Number($('#maxInput').value) || 100;
  const ok = clean.length && clean.every(r => r.degree <= max);
  const hash = ok ? fnv1a([T.code, T.cls, T.month, clean.map(r => r.name + ';' + r.degree).join('|')].join('|')) : '';
  if (dr.sentHash && hash && dr.sentHash === hash) {
    el.className = 'send-bar ok';
    el.textContent = '✓✓ تم الإرسال بنجاح • ' + T.month;
  } else if (dr.sentHash) {
    el.className = 'send-bar pending';
    el.textContent = 'لديك تعديلات لم تُرسل بعد';
  } else {
    el.className = 'send-bar no';
    el.textContent = 'لم يتم الإرسال بعد';
  }
}

function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}

async function sendGrades() {
  const dr = T.drafts[draftKey()];
  const cls = (T.cls || '').trim();
  const month = T.month;
  const max = Number($('#maxInput').value) || 100;
  if (!cls) { toast('اختر الشعبة', true); return; }
  const clean = [];
  let err = '';
  dr.rows.forEach((r, i) => {
    const nm = (r.name || '').trim();
    const dg = String(r.degree ?? '').trim();
    if (!nm && dg === '') return;
    if (!nm) { err = 'الصف ' + (i + 1) + ': اكتب الاسم'; return; }
    if (dg === '') { err = 'الصف ' + (i + 1) + ': أدخل درجة'; return; }
    const v = Number(dg);
    if (isNaN(v)) { err = 'الصف ' + (i + 1) + ': درجة غير صحيحة'; return; }
    if (v < 0 || v > max) { err = 'الصف ' + (i + 1) + ': خارج النطاق'; return; }
    clean.push({ name: nm, degree: v });
  });
  if (err) { toast(err, true); return; }
  if (!clean.length) { toast('أدخل الدرجات أولاً', true); return; }

  const btn = $('#sendBtn');
  btn.classList.add('busy');
  btn.disabled = true;

  try {
    const checksum = fnv1a([T.code, cls, month, clean.map(r => r.name + ';' + r.degree).join('|')].join('|'));
    const r = await api({
      action: 'submitGrades',
      code: T.code, cls, month, maxDegree: max,
      rows: clean.map(r => ({ name: r.name, v: [r.degree, null, null, null, null] })),
      checksum, batchId: 'b' + checksum, sentAt: Date.now()
    });
    if (r.ok) {
      dr.sentHash = checksum;
      dr.sentAt = r.time || Date.now();
      saveDraft(); updSendBar();
      toast(r.duplicate ? 'مُرسلة سابقاً ✓✓' : 'تم الإرسال ✓✓');
    } else {
      toast('❌ ' + r.error, true);
    }
  } catch (e) {
    toast(' لا اتصال', true);
  } finally {
    btn.classList.remove('busy');
    btn.disabled = false;
  }
}

function openPaste() { $('#pasteBox').value = ''; $('#pasteModal').classList.add('show'); }

function doPaste() {
  const t = $('#pasteBox').value;
  const dr = T.drafts[draftKey()];
  let n = 0;
  t.split(/\r?\n/).forEach(l => {
    if (!l.trim()) return;
    const p = l.split(/\t/).map(s => s.trim());
    let name = '', deg = '';
    if (p.length >= 2) { name = p[0]; deg = p[1]; }
    else { const m = l.match(/^(.*?)\s+([\d.]+)\s*$/); if (m) { name = m[1]; deg = m[2]; } else name = l.trim(); }
    if (name) { dr.rows.push({ name, degree: deg }); n++; }
  });
  if (!n) { toast('لم أجد بيانات', true); return; }
  saveDraft(); renderRows(); updStats(); updSendBar();
  hideModal('pasteModal');
  toast('✓ تمت إضافة ' + arNum(n) + ' تلميذ');
}

// تهيئة
(function init() {
  const s = JSON.parse(localStorage.getItem('d_session') || 'null');
  if (s) enterHome();
})();
</script>
</body>
