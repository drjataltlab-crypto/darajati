<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>درجاتي - تطبيق المعلمين</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--n:#123b73;--b:#1678df;--g:#16a673;--r:#ef4056;--y:#f2a900;--line:#d6e7f7;--t:#173b68}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,Arial;background:#edf7ff;color:var(--t);max-width:480px;margin:0 auto;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.1)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ═══ شاشة تسجيل الدخول ═══ */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(145deg,#eaf8ff,#fff 55%,#dff1ff)}
.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 12px 35px #174b7a20}
.ltop{background:linear-gradient(145deg,#0e4c94,#176fd0);color:white;text-align:center;padding:28px}
.ltop .logo{font-size:58px}
.ltop h1{font-size:36px;margin:4px;font-weight:900}
.ltop p{margin:0;font-size:13px;opacity:.9}
.form{padding:24px}
.field{position:relative;margin:12px 0}
.field input{width:100%;padding:14px 45px 14px 12px;border:1px solid #c8def3;border-radius:14px;outline:0;font-size:16px;text-align:center;font-weight:800}
.field input:focus{border-color:var(--b)}
.ico{position:absolute;right:14px;top:14px;font-size:21px}
.primary{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#1595ee,#155fd8);color:white;font-weight:bold;font-size:16px;margin-top:8px;box-shadow:0 6px 20px rgba(21,149,238,.3)}
.primary:active{transform:scale(.98)}
.demo{text-align:center;background:#f1f7fd;color:#58718e;border-radius:10px;padding:9px;margin-top:12px;font-size:12px}
.msg{text-align:center;color:var(--r);min-height:18px;margin-top:8px;font-weight:bold}

/* ═══ التطبيق ══ */
#app{display:none}
.header{background:linear-gradient(145deg,#092e60,#145aa8);color:#fff;padding:12px;position:sticky;top:0;z-index:20;box-shadow:0 5px 20px #103e6820}
.head{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px}
.brandlogo{width:42px;height:42px;border:2px solid #9ed8ff;border-radius:50%;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.15)}
.brand h2{margin:0;font-size:17px}
.brand small{color:#d8ecff;font-size:11px;display:block}
.header-actions{display:flex;gap:6px}
.hbtn{border:0;background:rgba(255,255,255,.2);color:#fff;padding:8px 10px;border-radius:10px;font-size:16px;position:relative}
.hbtn:active{background:rgba(255,255,255,.35)}
.hbadge{position:absolute;top:-3px;left:-3px;background:var(--r);color:#fff;font-size:9px;font-weight:900;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;border:2px solid var(--n)}

.hero{background:#eaf7ff;color:#14487e;border-radius:18px;padding:12px 15px;display:flex;justify-content:space-between;gap:8px;margin:10px 10px 0;flex-wrap:wrap}
.hero span{font-size:12px;color:#557794}
.hero b{color:var(--n);font-size:13px}

main{padding:10px 10px 100px}

/* ═══ الفلاتر ═══ */
.filters{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:10px}
@media(min-width:400px){.filters{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #15507f12;padding:13px}
.sel label{display:block;font-size:11px;color:#587795;font-weight:bold;margin-bottom:5px}
.sel select{width:100%;padding:10px;border:1px solid #c9def2;border-radius:12px;background:white;color:var(--t);font-weight:700}
.sel select:focus{outline:none;border-color:var(--b)}

/* ═══ الإحصائيات ═══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.stat{text-align:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.stat b{display:block;font-size:22px;margin:5px;color:var(--n)}
.stat small{font-size:10px;color:#587795;font-weight:bold}
.stat.students{border-top:3px solid var(--b)}
.stat.students b{color:var(--b)}
.stat.sum{border-top:3px solid var(--g)}
.stat.sum b{color:var(--g)}
.stat.avg{border-top:3px solid #6c57d8}
.stat.avg b{color:#6c57d8}
.stat.pass{border-top:3px solid var(--y)}
.stat.pass b{color:var(--y)}
.stat.comp{border-top:3px solid var(--r)}
.stat.comp b{color:var(--r)}

/* ═══ الأدوات ═══ */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.actions button{border:0;border-radius:12px;padding:11px;color:white;font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.actions button:active{transform:scale(.97)}
.add{background:var(--g)}
.copy{background:var(--b)}
.clear{background:var(--r)}
.paste{background:#6c57d8}
.max-input{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px}
.max-input label{font-size:11px;color:#587795;font-weight:bold}
.max-input input{width:60px;padding:6px;border:1px solid #c9def2;border-radius:8px;text-align:center;font-weight:bold}

/* ═══ البحث ═══ */
.search{position:relative;margin-top:10px}
.search input{width:100%;padding:12px 43px 12px 12px;border:1px solid #c9def2;border-radius:13px;outline:0;font-size:14px}
.search input:focus{border-color:var(--b)}
.search span{position:absolute;right:13px;top:10px;font-size:20px}

/* ═══ الجدول ═══ */
.table{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:35px 1fr 75px 35px;align-items:center;padding:9px 8px;font-size:13px}
.th{background:linear-gradient(90deg,#174e91,#1e65b8);color:white;font-weight:bold}
.tr{background:white;border-top:1px solid #e5eef7}
.tr:nth-child(odd){background:#f8fbfe}
.name-input{border:1px solid #c9def2;border-radius:8px;padding:7px;font-weight:bold;width:100%;font-size:13px}
.name-input:focus{outline:none;border-color:var(--b)}
.grade-input{width:100%;padding:7px;border:2px solid #fecaca;border-radius:8px;text-align:center;font-weight:900;font-size:14px;background:#fef2f2;color:var(--r)}
.grade-input.pass{background:#d9f8e9;border-color:#86efac;color:#07865c}
.grade-input.fail{background:#ffe0e4;border-color:#fca5a5;color:#d92b42}
.grade-input:focus{outline:none}
.del-btn{background:none;border:none;color:#cbd5e1;font-size:18px;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.del-btn:hover{background:#fee2e2;color:var(--r)}
.num-badge{width:28px;height:28px;border-radius:8px;background:#e0f2fe;color:var(--b);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}

/* ═══ شريط الإرسال ═══ */
.send-bar{margin-top:10px;padding:12px;border-radius:14px;text-align:center;font-size:13px;font-weight:bold}
.send-bar.ok{background:#d9f8e9;color:#07865c}
.send-bar.pending{background:#fff7df;color:#92400e}
.send-bar.no{background:#fff;color:var(--t);border:2px dashed var(--line)}

/* ═══ زر الإرسال العائم ═══ */
.fab{position:fixed;bottom:20px;left:20px;width:60px;height:60px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--g),#0d8a5e);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 25px rgba(22,166,115,.4);z-index:100;display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:active{transform:scale(.9)}
.fab.busy{background:#94a3b8}
.fab.busy::after{content:'';width:24px;height:24px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ التوست ═══ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--n);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;font-weight:bold;z-index:200;opacity:0;transition:.3s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--r)}
.toast.ok{background:var(--g)}

/* ═══ النوافذ المنبثقة ═══ */
.overlay{position:fixed;inset:0;background:rgba(18,59,115,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{color:var(--n);margin-bottom:12px;font-size:18px}
.modal textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:14px;resize:vertical;min-height:100px;font-family:inherit}
.modal textarea:focus{outline:none;border-color:var(--b)}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:bold;font-size:14px}
.modal-actions .cancel{background:#e2e8f0;color:var(--t)}
.modal-actions .ok{background:linear-gradient(90deg,#1595ee,#155fd8);color:#fff}

.msg-item{background:#f8fafc;border-radius:12px;padding:12px;margin-bottom:10px;border-right:4px solid var(--g)}
.msg-item.unread{background:#eff6ff;border-right-color:var(--b)}
.msg-date{font-size:11px;color:#587795;margin-bottom:4px}
.msg-text{font-size:14px;color:var(--t);line-height:1.6}

.empty-state{text-align:center;padding:30px;color:#587795}
.empty-state .icon{font-size:50px;margin-bottom:10px;opacity:.5}
.empty-state p{font-size:14px;font-weight:bold;margin-bottom:5px}
.empty-state small{font-size:12px}

.save-indicator{text-align:center;font-size:11px;color:var(--g);font-weight:bold;opacity:0;transition:.3s;margin-top:8px}
.save-indicator.show{opacity:1}
</style>
</head>
<body>

<!-- ═══ شاشة تسجيل الدخول ══ -->
<div id="login">
  <div class="loginbox">
    <div class="ltop">
      <div class="logo">🏫</div>
      <h1>درجاتي</h1>
      <p>تطبيق المعلمين لإدخال الدرجات</p>
    </div>
    <div class="form">
      <div class="field">
        <span class="ico"></span>
        <input id="codeInput" dir="ltr" placeholder="T-XXXX">
      </div>
      <button class="primary" onclick="doLogin()">تسجيل الدخول</button>
      <div class="msg" id="loginMsg"></div>
      <div class="demo">الكود من إدارة النظام</div>
    </div>
  </div>
</div>

<!-- ═══ التطبيق ═══ -->
<div id="app">
  <div class="header">
    <div class="head">
      <div class="brand">
        <div class="brandlogo"></div>
        <div>
          <h2 id="teacherName">مرحباً</h2>
          <small id="teacherInfo">—</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="hbtn" onclick="openMessages()" title="رسائل"><span id="msgBadge" class="hbadge">0</span></button>
        <button class="hbtn" onclick="copyCode()" title="نسخ الكود">🔑</button>
        <button class="hbtn" onclick="logout()" title="خروج">⏻</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <div><b id="heroSubject">—</b><br><span id="heroClass">—</span></div>
    <div style="text-align:left"><b id="heroMonth">—</b><br><span id="heroCode">—</span></div>
  </div>

  <main>
    <div class="filters">
      <div class="card sel">
        <label>📚 المادة</label>
        <select id="subjectSelect" onchange="onSubjectChange()"><option value="">اختر المادة</option></select>
      </div>
      <div class="card sel">
        <label>🏫 الشعبة</label>
        <select id="classSelect" onchange="onClassChange()"><option value="">اختر الشعبة</option></select>
      </div>
      <div class="card sel">
        <label>📅 الشهر</label>
        <select id="monthSelect" onchange="onMonthChange()"></select>
      </div>
    </div>

    <div class="stats">
      <div class="stat students"><small>التلاميذ</small><b id="statStudents">0</b></div>
      <div class="stat sum"><small>المجموع</small><b id="statSum">0</b></div>
      <div class="stat avg"><small>المتوسط</small><b id="statAvg">-</b></div>
      <div class="stat pass"><small>ناجح</small><b id="statPass">0</b></div>
      <div class="stat comp"><small>مكمل</small><b id="statComp">0</b></div>
    </div>

    <div class="actions">
      <button class="paste" onclick="openPaste()"> لصق</button>
      <button class="add" onclick="addRow()">+ تلميذ</button>
      <button class="copy" onclick="copyAll()">📄 نسخ الكل</button>
      <button class="clear" onclick="clearAll()">🗑️ مسح</button>
    </div>

    <div class="max-input">
      <label>🎯 العظمى:</label>
      <input id="maxInput" type="number" value="100" min="1" onchange="onCtx()">
    </div>

    <div class="search">
      <span>🔍</span>
      <input id="searchInput" type="text" placeholder="ابحث عن تلميذ..." oninput="renderRows()">
    </div>

    <div class="table">
      <div class="th">
        <div>#</div>
        <div>اسم التلميذ</div>
        <div style="text-align:center">الدرجة</div>
        <div></div>
      </div>
      <div id="studentsList"></div>
    </div>

    <div class="send-bar no" id="sendBar">لم يتم الإرسال بعد</div>
    <div class="save-indicator" id="saveInd">تم الحفظ التلقائي ✓</div>
  </main>

  <button class="fab" id="sendBtn" onclick="sendGrades()" title="إرسال للإدارة">▶</button>
</div>

<!-- نافذة اللصق -->
<div class="overlay" id="pasteModal">
  <div class="modal">
    <h3> لصق من Excel</h3>
    <p style="font-size:12px;color:#587795;margin-bottom:10px">انسخ عمودي (الاسم ثم الدرجة) والصق هنا</p>
    <textarea id="pasteBox" placeholder="أحمد محمد&#9;95&#10;سارة علي&#9;88"></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="hideModal('pasteModal')">إلغاء</button>
      <button class="ok" onclick="doPaste()">إضافة</button>
    </div>
  </div>
</div>

<!-- نافذة الرسائل -->
<div class="overlay" id="msgModal">
  <div class="modal">
    <h3>🔔 الرسائل</h3>
    <div id="msgList" style="margin-top:10px"></div>
    <div class="modal-actions">
      <button class="ok" onclick="hideModal('msgModal')">إغلاق</button>
    </div>
  </div>
</div>

<!-- نافذة التأكيد -->
<div class="overlay" id="confirmModal">
  <div class="modal">
    <h3>تأكيد</h3>
    <p id="confirmMsg" style="margin-bottom:15px;line-height:1.6"></p>
    <div class="modal-actions">
      <button class="cancel" onclick="hideModal('confirmModal')">إلغاء</button>
      <button class="ok" onclick="confirmAction()">نعم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ═══ تحميل config.js ═══ -->
<script src="config.js"></script>

<script>
// ═══ الإعدادات ═══
var MONTHS = APP_CONFIG.MONTHS;
var SUBJECT_COLORS = APP_CONFIG.SUBJECT_COLORS || {};

var AR = '٠١٢٣٤٥٦٧٨٩';
var arNum = function(x) { return String(x).replace(/\d/g, function(d) { return AR[d]; }); };
var $ = function(s) { return document.querySelector(s); };

var T = { code:'', name:'', subject:'', classes:[], cls:'', month:'', drafts:{}, subjects:[] };
var toastT, confirmFn = null, msgCheckInterval;
var draftKey = function() { return T.cls + '¦' + T.month; };

function toast(m, e) {
  var t = $('#toast');
  t.textContent = m;
  t.className = 'toast show' + (e ? ' err' : (m.indexOf('✓')>=0 ? ' ok' : ''));
  clearTimeout(toastT);
  toastT = setTimeout(function() { t.className = 'toast'; }, 3000);
}

function hideModal(id) { $('#' + id).classList.remove('show'); }

function confirmDlg(msg, fn) {
  $('#confirmMsg').textContent = msg;
  confirmFn = fn;
  $('#confirmModal').classList.add('show');
}

function confirmAction() {
  hideModal('confirmModal');
  if (confirmFn) confirmFn();
  confirmFn = null;
}

function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escA(s) { return esc(s).replace(/"/g, '&quot;'); }

function copyCode() {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(T.code).then(function() { toast('تم نسخ الكود ✓'); });
  }
}

function copyAll() {
  var dr = T.drafts[draftKey()];
  if (!dr || !dr.rows.length) { toast('لا توجد بيانات', true); return; }
  var text = dr.rows.filter(function(r){return r.name||r.degree}).map(function(r){return r.name+'\t'+(r.degree||'');}).join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast('تم نسخ الكل ✓'); });
  }
}

// ═══ API ═══
function api(p, ms) {
  var url = localStorage.getItem('d_url') || (typeof SERVER_URL !== 'undefined' ? SERVER_URL : '');
  if (!url) return Promise.reject(new Error('لا رابط'));
  var ctl = new AbortController();
  var t = setTimeout(function() { ctl.abort(); }, ms || 25000);
  return fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(p), signal:ctl.signal })
    .then(function(r) { return r.json(); })
    .finally(function() { clearTimeout(t); });
}

function fnv1a(str) {
  var h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}

// ═══ تسجيل الدخول ═══
function doLogin() {
  var code = $('#codeInput').value.trim().toUpperCase();
  if (!code) { $('#loginMsg').textContent = 'أدخل الكود'; return; }
  $('#loginMsg').textContent = 'جاري الاتصال...';
  api({ action:'teacherLogin', code:code }).then(function(r) {
    if (!r.ok) { $('#loginMsg').textContent = r.error || 'خطأ'; return; }
    localStorage.setItem('d_session', JSON.stringify(r.teacher));
    enterHome();
  }).catch(function(e) { $('#loginMsg').textContent = 'تعذر الاتصال'; });
}

function enterHome() {
  var s = JSON.parse(localStorage.getItem('d_session') || 'null');
  if (!s) { $('#login').style.display = 'flex'; $('#app').style.display = 'none'; return; }
  
  T.code = s.code || '';
  T.name = s.name || '';
  T.subject = s.subject || '';
  T.classes = s.classes || [];
  T.subjects = s.subjects || [];
  T.drafts = {};
  
  if (!T.subjects || T.subjects.length === 0) {
    if (T.subject && T.classes && T.classes.length > 0) {
      T.subjects = [{ name: T.subject, classes: T.classes }];
    }
  }
  
  T.month = MONTHS[0];
  T.cls = (T.classes && T.classes[0]) || '';

  $('#teacherName').textContent = T.name || 'مرحباً';
  $('#teacherInfo').textContent = (T.subject || '') + ' • ' + T.code;
  $('#heroCode').textContent = '🔑 ' + T.code;

  $('#login').style.display = 'none';
  $('#app').style.display = 'block';

  buildSelectors();
  updateHero();
  loadCurrent();
  requestNotificationPermission();
  checkMessages();
  msgCheckInterval = setInterval(checkMessages, 60000);
}

function logout() {
  clearInterval(msgCheckInterval);
  confirmDlg('تسجيل الخروج؟', function() {
    localStorage.removeItem('d_session');
    location.reload();
  });
}

// ═══ بناء القوائم ═══
function buildSelectors() {
  var subSel = $('#subjectSelect');
  subSel.innerHTML = '<option value="">اختر المادة</option>';
  if (T.subjects && T.subjects.length > 0) {
    for (var idx = 0; idx < T.subjects.length; idx++) {
      var sub = T.subjects[idx];
      var opt = document.createElement('option');
      opt.value = idx;
      var colorInfo = SUBJECT_COLORS[sub.name] || { icon: '' };
      opt.textContent = colorInfo.icon + ' ' + sub.name;
      subSel.appendChild(opt);
    }
    subSel.value = '0';
  }
  
  var monthSel = $('#monthSelect');
  monthSel.innerHTML = '';
  for (var i = 0; i < MONTHS.length; i++) {
    var m = MONTHS[i];
    var opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    if (m === T.month) opt.selected = true;
    monthSel.appendChild(opt);
  }
  
  onSubjectChange();
}

function onSubjectChange() {
  var idx = $('#subjectSelect').value;
  var clsSel = $('#classSelect');
  clsSel.innerHTML = '<option value="">اختر الشعبة</option>';
  
  if (idx === '' || !T.subjects[idx]) {
    T.subject = '';
    T.classes = [];
    T.cls = '';
    updateHero();
    loadCurrent();
    return;
  }
  
  T.subject = T.subjects[idx].name;
  T.classes = T.subjects[idx].classes || [];
  
  for (var i = 0; i < T.classes.length; i++) {
    var cl = T.classes[i];
    var opt = document.createElement('option');
    opt.value = cl;
    opt.textContent = '🏫 ' + cl;
    clsSel.appendChild(opt);
  }
  
  if (T.classes.length > 0) {
    clsSel.value = T.classes[0];
    T.cls = T.classes[0];
  } else {
    T.cls = '';
  }
  
  updateHero();
  loadCurrent();
}

function onClassChange() {
  T.cls = $('#classSelect').value;
  updateHero();
  loadCurrent();
}

function onMonthChange() {
  T.month = $('#monthSelect').value;
  updateHero();
  loadCurrent();
}

function updateHero() {
  $('#heroSubject').textContent = T.subject ? ' ' + T.subject : '—';
  $('#heroClass').textContent = T.cls ? '🏫 ' + T.cls : '—';
  $('#heroMonth').textContent = T.month ? '📅 ' + T.month : '—';
}

// ═══ تحميل البيانات ═══
function loadCurrent() {
  if (!T.cls || !T.subject) {
    $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>اختر المادة والشعبة</p><small>لعرض التلاميذ</small></div>';
    clearStats();
    $('#sendBar').className = 'send-bar no';
    $('#sendBar').textContent = 'لم يتم تحديد الشعبة';
    return;
  }
  
  var k = draftKey();
  if (!T.drafts[k]) {
    var sv = localStorage.getItem('d_draft_' + T.code + '_' + k);
    T.drafts[k] = sv ? JSON.parse(sv) : { rows: [], sentHash: '', sentAt: 0, max: 100 };
  }
  
  $('#maxInput').value = T.drafts[k].max || 100;
  
  if (T.drafts[k].rows.length === 0) {
    fetchStudents();
  } else {
    renderRows();
    updStats();
    updSendBar();
  }
}

function clearStats() {
  $('#statStudents').textContent = '0';
  $('#statSum').textContent = '0';
  $('#statAvg').textContent = '-';
  $('#statPass').textContent = '0';
  $('#statComp').textContent = '0';
}

function fetchStudents() {
  $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>جاري التحميل...</p></div>';
  api({ action: 'getStudents', code: T.code, cls: T.cls }).then(function(r) {
    if (r.ok && r.names && r.names.length > 0) {
      var k = draftKey();
      T.drafts[k].rows = r.names.map(function(n) { return { name: n, degree: '' }; });
      saveDraft();
      renderRows();
      updStats();
      updSendBar();
      toast('✓ تم تحميل ' + arNum(r.names.length) + ' تلميذ');
    } else {
      $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>لا توجد أسماء</p><small>تواصل مع الإدارة</small></div>';
    }
  }).catch(function(e) {
    $('#studentsList').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>تعذر التحميل</p></div>';
  });
}

function onCtx() { saveDraft(); updStats(); updSendBar(); }

function saveDraft() {
  var k = draftKey();
  if (!T.drafts[k]) return;
  T.drafts[k].max = Number($('#maxInput').value) || 100;
  localStorage.setItem('d_draft_' + T.code + '_' + k, JSON.stringify(T.drafts[k]));
  var ind = $('#saveInd');
  ind.classList.add('show');
  setTimeout(function() { ind.classList.remove('show'); }, 2000);
}

function renderRows() {
  var dr = T.drafts[draftKey()];
  var box = $('#studentsList');
  if (!dr) { box.innerHTML = ''; return; }
  var search = ($('#searchInput').value || '').trim().toLowerCase();
  var max = Number($('#maxInput').value) || 100;
  box.innerHTML = '';
  
  var displayIndex = 1;
  for (var i = 0; i < dr.rows.length; i++) {
    var r = dr.rows[i];
    if (search && !(r.name || '').toLowerCase().includes(search)) continue;
    
    var deg = Number(r.degree);
    var isPass = !isNaN(deg) && deg >= max / 2;
    var isFail = !isNaN(deg) && deg < max / 2 && deg >= 0;
    var cls = isPass ? 'pass' : (isFail ? 'fail' : '');
    
    var row = document.createElement('div');
    row.className = 'tr';
    row.innerHTML = '<div class="num-badge">' + arNum(displayIndex) + '</div>' +
      '<input class="name-input" placeholder="اسم التلميذ" value="' + escA(r.name) + '">' +
      '<input class="grade-input ' + cls + '" type="number" inputmode="decimal" placeholder="—" value="' + (r.degree === '' ? '' : escA(r.degree)) + '">' +
      '<button class="del-btn">✕</button>';
    
    var inputs = row.querySelectorAll('input');
    (function(idx, inp) {
      inp[0].oninput = function() { dr.rows[idx].name = inp[0].value; saveDraft(); updStats(); updSendBar(); };
      inp[1].oninput = function() {
        dr.rows[idx].degree = inp[1].value;
        var v = Number(inp[1].value);
        inp[1].classList.remove('pass', 'fail');
        if (!isNaN(v) && v >= max / 2) inp[1].classList.add('pass');
        else if (!isNaN(v) && v < max / 2 && v >= 0) inp[1].classList.add('fail');
        saveDraft(); updStats(); updSendBar();
      };
    })(i, inputs);
    
    (function(idx) {
      row.querySelector('.del-btn').onclick = function() {
        if (dr.rows.length <= 1) { toast('يجب بقاء صف واحد', true); return; }
        dr.rows.splice(idx, 1); saveDraft(); renderRows(); updStats(); updSendBar();
      };
    })(i);
    
    box.appendChild(row);
    displayIndex++;
  }
  
  if (displayIndex === 1 && !search) {
    box.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>لا توجد أسماء</p><small>استخدم "لصق" أو "+ تلميذ"</small></div>';
  } else if (displayIndex === 1 && search) {
    box.innerHTML = '<div class="empty-state"><div class="icon"></div><p>لا توجد نتائج</p></div>';
  }
}

function addRow() {
  if (!T.cls) { toast('اختر الشعبة أولاً', true); return; }
  T.drafts[draftKey()].rows.push({ name: '', degree: '' });
  saveDraft(); renderRows();
  var last = $('#studentsList').lastElementChild;
  if (last) { var inp = last.querySelector('input'); if (inp) inp.focus(); }
}

function clearAll() {
  confirmDlg('مسح جميع التلاميذ والدرجات؟', function() {
    T.drafts[draftKey()].rows = [];
    saveDraft(); renderRows(); updStats(); updSendBar();
    toast('تم المسح ✓');
  });
}

function updStats() {
  var dr = T.drafts[draftKey()];
  if (!dr) return;
  var max = Number($('#maxInput').value) || 100;
  var rows = dr.rows.filter(function(r) { return (r.name || '').trim() || String(r.degree ?? '') !== ''; });
  var dg = rows.map(function(r) { return Number(r.degree); }).filter(function(v) { return !isNaN(v); });
  var sum = dg.reduce(function(a, b) { return a + b; }, 0);
  var avg = dg.length ? (sum / dg.length).toFixed(1) : '-';
  var pass = dg.filter(function(v) { return v >= max / 2; }).length;
  var comp = dg.filter(function(v) { return v >= (max / 2) - 10 && v < max / 2; }).length;
  
  $('#statStudents').textContent = arNum(rows.length);
  $('#statSum').textContent = arNum(sum);
  $('#statAvg').textContent = avg === '-' ? '-' : arNum(avg.replace('.', '٫'));
  $('#statPass').textContent = arNum(pass);
  $('#statComp').textContent = arNum(comp);
}

function updSendBar() {
  var dr = T.drafts[draftKey()];
  var el = $('#sendBar');
  if (!dr) return;
  var clean = dr.rows.filter(function(r) { return (r.name || '').trim() && String(r.degree ?? '') !== ''; })
    .map(function(r) { return { name: r.name, degree: Number(r.degree) }; });
  var max = Number($('#maxInput').value) || 100;
  var ok = clean.length && clean.every(function(r) { return r.degree <= max; });
  var hash = ok ? fnv1a([T.code, T.cls, T.month, clean.map(function(r) { return r.name + ';' + r.degree; }).join('|')].join('|')) : '';
  if (dr.sentHash && hash && dr.sentHash === hash) {
    el.className = 'send-bar ok';
    el.textContent = '✓✓ تم الإرسال • ' + T.month;
  } else if (dr.sentHash) {
    el.className = 'send-bar pending';
    el.textContent = 'لديك تعديلات لم تُرسل';
  } else {
    el.className = 'send-bar no';
    el.textContent = 'لم يتم الإرسال بعد';
  }
}

// ═══ إرسال الدرجات ═══
function sendGrades() {
  var dr = T.drafts[draftKey()];
  var cls = (T.cls || '').trim();
  var month = T.month;
  var max = Number($('#maxInput').value) || 100;
  if (!cls) { toast('اختر الشعبة', true); return; }
  if (!T.subject) { toast('اختر المادة', true); return; }
  
  var clean = [];
  var err = '';
  for (var i = 0; i < dr.rows.length; i++) {
    var nm = (dr.rows[i].name || '').trim();
    var dg = String(dr.rows[i].degree ?? '').trim();
    if (!nm && dg === '') continue;
    if (!nm) { err = 'الصف ' + (i + 1) + ': اكتب الاسم'; break; }
    if (dg === '') { err = 'الصف ' + (i + 1) + ': أدخل درجة'; break; }
    var v = Number(dg);
    if (isNaN(v)) { err = 'الصف ' + (i + 1) + ': درجة غير صحيحة'; break; }
    if (v < 0 || v > max) { err = 'الصف ' + (i + 1) + ': خارج النطاق'; break; }
    clean.push({ name: nm, degree: v });
  }
  if (err) { toast(err, true); return; }
  if (!clean.length) { toast('أدخل الدرجات أولاً', true); return; }

  confirmDlg('إرسال ' + arNum(clean.length) + ' درجة للإدارة؟', function() {
    var btn = $('#sendBtn');
    btn.classList.add('busy');
    btn.disabled = true;

    var checksum = fnv1a([T.code, cls, month, clean.map(function(r) { return r.name + ';' + r.degree; }).join('|')].join('|'));
    api({
      action: 'submitGrades',
      code: T.code, cls: cls, month: month, maxDegree: max,
      rows: clean.map(function(r) { return { name: r.name, v: [r.degree, null, null, null, null] }; }),
      checksum: checksum, batchId: 'b' + checksum, sentAt: Date.now()
    }).then(function(r) {
      if (r.ok) {
        dr.sentHash = checksum;
        dr.sentAt = r.time || Date.now();
        saveDraft(); updSendBar();
        toast(r.duplicate ? 'مُرسلة سابقاً ✓✓' : '✓✓ تم الإرسال للإدارة');
      } else {
        toast('❌ ' + r.error, true);
      }
    }).catch(function(e) {
      toast(' لا اتصال', true);
    }).finally(function() {
      btn.classList.remove('busy');
      btn.disabled = false;
    });
  });
}

// ═══ اللصق ══
function openPaste() { $('#pasteBox').value = ''; $('#pasteModal').classList.add('show'); }

function doPaste() {
  var t = $('#pasteBox').value;
  var dr = T.drafts[draftKey()];
  var n = 0;
  t.split(/\r?\n/).forEach(function(l) {
    if (!l.trim()) return;
    var p = l.split(/\t/).map(function(s) { return s.trim(); });
    var name = '', deg = '';
    if (p.length >= 2) { name = p[0]; deg = p[1]; }
    else { var m = l.match(/^(.*?)\s+([\d.]+)\s*$/); if (m) { name = m[1]; deg = m[2]; } else name = l.trim(); }
    if (name) { dr.rows.push({ name: name, degree: deg }); n++; }
  });
  if (!n) { toast('لم أجد بيانات', true); return; }
  saveDraft(); renderRows(); updStats(); updSendBar();
  hideModal('pasteModal');
  toast('✓ تمت إضافة ' + arNum(n) + ' تلميذ');
}

// ═══ الإشعارات ═══
function requestNotificationPermission() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function checkMessages() {
  if (!T.code) return;
  api({ action: 'getMessages', code: T.code }).then(function(r) {
    if (r.ok) {
      var badge = $('#msgBadge');
      if (r.unread > 0) {
        badge.textContent = arNum(r.unread);
        badge.style.display = 'flex';
        if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
          new Notification("رسالة من الإدارة", { body: "لديك رسالة جديدة في درجاتي", icon: "icon.png" });
        }
      } else {
        badge.style.display = 'none';
      }
    }
  }).catch(function(e) { });
}

function openMessages() {
  requestNotificationPermission();
  $('#msgModal').classList.add('show');
  $('#msgList').innerHTML = '<div style="text-align:center;padding:20px;color:#587795">جاري التحميل...</div>';
  
  api({ action: 'getMessages', code: T.code }).then(function(r) {
    if (r.ok && r.messages.length > 0) {
      var html = '';
      r.messages.forEach(function(m) {
        html += '<div class="msg-item ' + (m.read ? '' : 'unread') + '">' +
          '<div class="msg-date">' + m.date + (m.read ? ' • مقروءة' : ' • جديدة') + '</div>' +
          '<div class="msg-text">' + esc(m.msg) + '</div></div>';
      });
      $('#msgList').innerHTML = html;
      checkMessages();
    } else {
      $('#msgList').innerHTML = '<div style="text-align:center;padding:20px;color:#587795">لا توجد رسائل</div>';
    }
  }).catch(function() {
    $('#msgList').innerHTML = '<div style="text-align:center;padding:20px;color:var(--r)">تعذر التحميل</div>';
  });
}

// ══ التهيئة ═══
(function() {
  var s = JSON.parse(localStorage.getItem('d_session') || 'null');
  if (s) enterHome();
})();
</script>
